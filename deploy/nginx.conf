# /etc/nginx/sites-available/madonnahist.gaylon.photos
# Reverse proxy madonnahist.gaylon.photos -> 127.0.0.1:3002 (PM2/SvelteKit).
# Cloudflare in front, TLS mode Full (Strict), origin cert at /etc/ssl/cloudflare/.

server {
    listen 80;
    listen [::]:80;
    server_name madonnahist.gaylon.photos;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name madonnahist.gaylon.photos;

    ssl_certificate     /etc/ssl/cloudflare/madonnahist.crt;
    ssl_certificate_key /etc/ssl/cloudflare/madonnahist.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # upload-page.mjs is a Node script, not browser-driven. Keep this modest.
    client_max_body_size 1m;

    access_log /var/log/nginx/madonnahist.access.log;
    error_log  /var/log/nginx/madonnahist.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
