# /etc/nginx/sites-available/madonnahist.gaylon.photos
# Reverse proxy madonnahist.gaylon.photos -> 127.0.0.1:3002 (PM2/SvelteKit).
# Cloudflare in front, zone TLS mode Flexible, origin is HTTP-only on :80.
# Matches the sibling apps (gaylonphotos, giftlist) on this droplet.
# Upgrading to Full (Strict) is a zone-wide change — coordinate across all
# three apps before flipping.

server {
    listen 80;
    listen [::]:80;
    server_name madonnahist.gaylon.photos;

    # upload-page.mjs is a Node script run server-side; this is just the
    # browser-facing surface (correction UI saves, viewer reads).
    client_max_body_size 1m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/madonnahist.access.log;
    error_log  /var/log/nginx/madonnahist.error.log;

    # Block /admin from the public internet. Admin access is via SSH tunnel
    # to localhost:3002 only. TODO td-510a34: remove when real auth lands.
    location /admin {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
