# /etc/nginx/sites-available/madonnahist.gaylon.photos
# Reverse proxy madonnahist.gaylon.photos -> 127.0.0.1:3002 (PM2/SvelteKit).
# Cloudflare in front, zone TLS mode Flexible, origin is HTTP-only on :80.
# Matches the sibling apps (gaylonphotos, giftlist) on this droplet.
# Upgrading to Full (Strict) is a zone-wide change — coordinate across all
# three apps before flipping.

# Invite links (/invite/<token>, V3 Slice 1b) are one-time credentials:
# log them as /invite/[redacted]. Same fields as nginx's default "combined"
# format otherwise. map/log_format live at http level (this file is
# included inside http {}), so their names are prefixed to stay unique on
# the shared droplet.
map $request_uri $madonnahist_log_uri {
    ~^/invite/  "/invite/[redacted]";
    default     $request_uri;
}
log_format madonnahist_redacted '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $madonnahist_log_uri $server_protocol" '
                                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name madonnahist.gaylon.photos;

    # upload-page.mjs is a Node script run server-side; this is just the
    # browser-facing surface (correction UI saves, viewer reads).
    client_max_body_size 1m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/madonnahist.access.log madonnahist_redacted;
    error_log  /var/log/nginx/madonnahist.error.log;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
